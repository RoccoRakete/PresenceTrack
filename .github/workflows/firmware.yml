name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read FIRMWARE_VERSION from include/firmware.h
        id: version
        run: |
          set -euo pipefail
          version=$(grep -oP '#define FIRMWARE_VERSION "\K[0-9.]+' include/firmware.h)
          if [ -z "$version" ]; then
            echo "Could not read FIRMWARE_VERSION from include/firmware.h" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "FIRMWARE_VERSION=$version"

      # Contract with the firmware (include/firmware.h, comment at FIRMWARE_VERSION):
      # a tag build MUST be named exactly v<FIRMWARE_VERSION>. Otherwise the
      # release assets would carry a different version in their names than the
      # device reports under /api/system (fw_version) after the upload.
      - name: Check tag against FIRMWARE_VERSION
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="v${{ steps.version.outputs.version }}"
          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "Tag ${{ github.ref_name }} does not match FIRMWARE_VERSION ${{ steps.version.outputs.version }} (expected $expected)" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: PlatformIO cache
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware and filesystem
        # On a fresh checkout "pio run -t buildfs" builds only the filesystem
        # image, not the firmware - both targets need separate invocations to
        # get firmware.bin AND littlefs.bin.
        run: |
          pio run
          pio run -t buildfs

      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/d1_mini/firmware.bin
          if-no-files-found: error

      - name: Upload littlefs.bin
        uses: actions/upload-artifact@v4
        with:
          name: littlefs
          path: .pio/build/d1_mini/littlefs.bin
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: littlefs
          path: dist

      - name: Name assets and generate checksums
        id: assets
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          fw_name="presencetrack-${version}-firmware.bin"
          fs_name="presencetrack-${version}-littlefs.bin"
          sums_name="presencetrack-${version}-checksums.txt"
          mv "dist/firmware.bin" "dist/${fw_name}"
          mv "dist/littlefs.bin" "dist/${fs_name}"

          (cd dist && sha256sum "${fw_name}" "${fs_name}" > "${sums_name}")

          echo "fw_name=${fw_name}" >> "$GITHUB_OUTPUT"
          echo "fs_name=${fs_name}" >> "$GITHUB_OUTPUT"
          echo "sums_name=${sums_name}" >> "$GITHUB_OUTPUT"

      - name: Assemble release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # Not "git tag -l --format=%(contents)" on the local checkout: when
          # checking out a tag ref, actions/checkout creates the tag as a local
          # ref pointing straight at the commit, without fetching the tag object
          # (including its annotation) - "%(contents)" then silently returns the
          # commit message instead of the tag message. Read the tag object via
          # the API instead, which does not depend on the local checkout state.
          tag_sha="$(gh api "repos/${{ github.repository }}/git/refs/tags/$tag" --jq .object.sha)"
          tag_type="$(gh api "repos/${{ github.repository }}/git/refs/tags/$tag" --jq .object.type)"
          if [ "$tag_type" = "tag" ]; then
            annotation="$(gh api "repos/${{ github.repository }}/git/tags/$tag_sha" --jq .message)"
          else
            annotation=""
          fi
          if [ -z "$annotation" ]; then
            annotation="PresenceTrack $tag."
          fi
          {
            printf '%s\n' "$annotation"
            echo ""
            echo "---"
            echo ""
            echo "**Updating the device:** download both files and upload them in the web UI"
            echo "under the \"Firmware\" tab, or flash via USB with \`flash.sh\`."
            echo ""
            echo "**Files in this release:**"
            echo "- \`${{ steps.assets.outputs.fw_name }}\` - firmware"
            echo "- \`${{ steps.assets.outputs.fs_name }}\` - filesystem (web UI from data/)"
            echo "- \`${{ steps.assets.outputs.sums_name }}\` - sha256 of both images"
          } > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            "dist/${{ steps.assets.outputs.fw_name }}" \
            "dist/${{ steps.assets.outputs.fs_name }}" \
            "dist/${{ steps.assets.outputs.sums_name }}" \
            --title "PresenceTrack ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --verify-tag
