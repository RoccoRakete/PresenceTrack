; PresenceTrack - ESP8266 Presence & Illuminance Sensor
; LD2410C (mmWave presence) + BH1750FVI (illuminance) -> Home Assistant via MQTT discovery

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

; fits most ESP8266 NodeMCU/D1 Mini boards; adjust board if needed
board_build.filesystem = littlefs
; Flash layout: board default eagle.flash.4m1m.ld (4 MB flash, 1 MB LittleFS), deliberately
; not overridden - OTA in the web UI (tab "Firmware") and the size check in
; src/web_server.cpp rely on exactly this layout:
;   Sketch:   max. 1044464 B (1 MB irom window, checked by "pio run" as "Flash ... from")
;   OTA:      the new firmware is staged below FS_start (0x300000);
;             limit = ESP.getFreeSketchSpace() - 4 KB (~2.3 MB with a ~660 KB sketch),
;             so the binding constraint is the 1 MB sketch limit, not the OTA space
;   LittleFS: 0x300000-0x3FA000 = 1024000 B (125 blocks x 8 KB); "pio run -t buildfs"
;             produces .pio/build/d1_mini/littlefs.bin with exactly this size - /api/filesystem
;             rejects an image built for a different layout
; Anyone changing board_build.ldscript has to rebuild the images to match; changing the
; layout itself only works via USB, not via OTA.
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ottowinter/ESPAsyncWebServer-esphome @ ^3.2.0
    esphome/ESPAsyncTCP-esphome @ ^2.0.0
    knolleary/PubSubClient @ ^2.8
    tzapu/WiFiManager @ ^2.0.17

; No -D ASYNCWEBSERVER_REGEX: no regex route is used, but <regex> pulls the
; libstdc++ locale tables into RAM - measured 11.4 kB of static RAM (55076 ->
; 43612 B) and 198 kB of flash. That RAM was missing from the heap, which has to carry
; page loads with parallel requests (otherwise OOM panic = reboot on every reload).
; UMM_STATS_FULL: exact heap low-water mark for /api/system (min_free_heap);
; UMM_INFO then has to be added explicitly, otherwise ESP.getHeapFragmentation() & co. are missing.
build_flags =
    -D UMM_STATS_FULL
    -D UMM_INFO
