; PresenceTrack - ESP8266 Presence & Illuminance Sensor
; LD2410C (mmWave presence) + BH1750FVI (illuminance) -> Home Assistant via MQTT discovery

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

; passt zu den meisten ESP8266 NodeMCU/D1-Mini Boards; bei Bedarf board anpassen
board_build.filesystem = littlefs
; Flash-Layout: Board-Default eagle.flash.4m1m.ld (4 MB Flash, 1 MB LittleFS), bewusst
; nicht ueberschrieben - OTA im Web-UI (Tab "Firmware") und die Groessenpruefung in
; src/web_server.cpp setzen genau dieses Layout voraus:
;   Sketch:   max. 1044464 B (1 MB irom-Fenster, von "pio run" als "Flash ... from" geprueft)
;   OTA:      neue Firmware wird unterhalb von FS_start (0x300000) zwischengespeichert;
;             Grenze = ESP.getFreeSketchSpace() - 4 KB (~2,3 MB bei ~660 KB Sketch),
;             bindend ist also das 1-MB-Sketch-Limit, nicht der OTA-Platz
;   LittleFS: 0x300000-0x3FA000 = 1024000 B (125 Bloecke x 8 KB); "pio run -t buildfs"
;             erzeugt .pio/build/d1_mini/littlefs.bin mit exakt dieser Groesse - ein Image
;             fuer ein anderes Layout lehnt /api/filesystem ab
; Wer board_build.ldscript aendert, muss die Images passend neu bauen; ein Wechsel des
; Layouts selbst geht nur per USB, nicht per OTA.
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ottowinter/ESPAsyncWebServer-esphome @ ^3.2.0
    esphome/ESPAsyncTCP-esphome @ ^2.0.0
    knolleary/PubSubClient @ ^2.8
    tzapu/WiFiManager @ ^2.0.17

; Kein -D ASYNCWEBSERVER_REGEX: es wird keine Regex-Route genutzt, aber <regex> zieht
; die libstdc++-Locale-Tabellen ins RAM - gemessen 11,4 kB statisches RAM (55076 ->
; 43612 B) und 198 kB Flash. Das RAM fehlte dem Heap, der Seitenaufrufe mit parallelen
; Requests tragen muss (sonst OOM-Panic = Neustart bei jedem Reload).
; UMM_STATS_FULL: exakter Heap-Tiefstwert fuer /api/system (min_free_heap);
; UMM_INFO muss dann explizit dazu, sonst fehlen ESP.getHeapFragmentation() & Co.
build_flags =
    -D UMM_STATS_FULL
    -D UMM_INFO
